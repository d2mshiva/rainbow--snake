<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="top">
      <h1 class="logo">RAINBOW<span>SNAKE</span></h1>
      <div class="hud" aria-live="polite">
        <div class="stat"><span class="label">Score</span><strong id="score">0</strong></div>
        <div class="stat"><span class="label">Best</span><strong id="best">0</strong></div>
        <div class="stat"><span class="label">Level</span><strong id="level">1</strong></div>
      </div>
    </header>

    <section class="stage">
      <canvas id="board" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">RAINBOW SNAKE</h2>
        <p id="overlayText">Press an arrow key, WASD or Start.</p>
      </div>
    </section>

    <div class="controls">
      <button id="startBtn" class="btn btn-start" type="button">Start</button>
      <button id="resetBtn" class="btn btn-reset" type="button">Reset</button>
    </div>

    <div class="speed" role="group" aria-label="Snake speed">
      <span class="speed-label">Speed</span>
      <button class="speed-btn" type="button" data-speed="slow" aria-pressed="false">Slow</button>
      <button class="speed-btn" type="button" data-speed="normal" aria-pressed="true">Normal</button>
      <button class="speed-btn" type="button" data-speed="fast" aria-pressed="false">Fast</button>
      <button class="speed-btn" type="button" data-speed="insane" aria-pressed="false">Insane</button>
    </div>

    <div class="dpad" aria-label="Touch controls">
      <button class="pad" type="button" data-dir="up" aria-label="Up">&uarr;</button>
      <button class="pad" type="button" data-dir="left" aria-label="Left">&larr;</button>
      <button class="pad" type="button" data-dir="down" aria-label="Down">&darr;</button>
      <button class="pad" type="button" data-dir="right" aria-label="Right">&rarr;</button>
    </div>

    <p class="hint">
      <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &middot;
      <kbd>Space</kbd> pause &middot; <kbd>R</kbd> reset &middot; <kbd>1</kbd>-<kbd>4</kbd> speed
    </p>

  </main>
  <script src="app.js"></script>
</body>
</html>
